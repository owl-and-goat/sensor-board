[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[features]
# `defmt::Format` on every type, for the firmware's log.
defmt = ["dep:defmt", "heapless/defmt"]
clap = ["dep:clap", "std"]
std = ["serde/std", "thiserror/std"]

[dependencies]
defmt = { version = "1.1.1", optional = true }
heapless = { version = "0.9", default-features = false, features = ["serde"] }
postcard-schema = { version = "0.2.5", features = ["derive", "heapless-v0_9"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
clap = { version = "4.6", optional = true, features = ["derive"] }
thiserror = { version = "2.0", default-features = false }
enum-map = { version = "3.1", features = ["serde", "derive"] }
strum = { version = "0.28", default-features = false, features = ["derive"] }

# A revision of unreleased main. The released 0.12.1 only supports embassy-usb
# 0.5 on embassy-executor 0.9, and two executor versions cannot be linked into
# one firmware. The firmware and the CLI have to use this same revision.
[dependencies.postcard-rpc]
git = "https://github.com/jamesmunns/postcard-rpc.git"
rev = "d30141f7b2594050d5805f7c7d5be41f73bc7d82"
