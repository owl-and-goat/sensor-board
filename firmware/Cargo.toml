[package]
name = "sensor-board-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# low-power and executor-thread: embassy-stm32's own executor, which puts the
# chip in Stop mode when every task is waiting and no peripheral is busy.
embassy-stm32 = { version = "0.6.0", features = ["defmt", "executor-thread", "exti", "low-power", "stm32wb55cg", "time-driver-any", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt"] }
embassy-futures = "0.1.2"
# Fork of embassy-stm32-wpan adding a Thread subsystem, CPU2 traces, and the
# FUS commands needed to install coprocessor firmware. All of the branch is
# upstreamable but its "NOT FOR UPSTREAM" commit, which uses released embassy
# crates rather than path deps; drop that one when opening the PR.
# https://github.com/glittershark/embassy/tree/wb55-thread
embassy-sync = { version = "0.8.0", features = ["defmt"] }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
# set-vtor: point VTOR at our own vector table on reset, so the app works no
# matter what the ROM bootloader left in VTOR after a DFU ":leave".
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }

defmt = "1.1.1"
defmt-rtt = "1.3.0"
# Raises the HardFault that probe-rs (or fault.rs, with no probe attached)
# catches. Without print-defmt, so the panic message is not logged: with it,
# every panic message and source location stays in the image, which took
# 27 K of flash.
panic-probe = "1.0.0"

protocol = { path = "../protocol", features = ["defmt"] }
static_cell = "2.1"
heapless = "0.9"
# log10 for the sound level in dB SPL.
libm = "0.2"

# Firmware updates: the state page that tells bootloader/ what to do at the
# next reset, flash partitions, and the digest check of a received image.
embassy-boot = { version = "0.7.0", features = ["defmt"] }
embassy-embedded-hal = "0.6.0"
embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"
sha2 = { version = "0.10", default-features = false }

bitvec = { version = "1.1", default-features = false }
device-driver = { version = "2.1.1", features = ["defmt", "macros"] }
embedded-hal = "1.0.0"

# Prometheus metrics in the text format. Not released on crates.io. The
# default features add timestamps, which need a clock the board does not have.
tinymetrics = { git = "https://github.com/hawkw/tinymetrics.git", rev = "58a73feea1c94b858313e40dce0248f669a1c4f0", default-features = false }
# HTTP for the scrape endpoint and for pushes. It runs on any embedded-io-async
# stream, which http.rs implements for the Thread TCP connection.
nanofish = "0.13.0"
embedded-io-async = "0.7.0"

# The same revision as in the protocol crate, which explains why it is not a
# release.
[dependencies.postcard-rpc]
git = "https://github.com/jamesmunns/postcard-rpc.git"
rev = "d30141f7b2594050d5805f7c7d5be41f73bc7d82"
features = ["embassy-usb-0_6-server"]

[dependencies.embassy-stm32-wpan]
git = "https://github.com/glittershark/embassy.git"
rev = "ebbabe3b4c979d0c9815b663649c5b85c59dfd30"
features = ["defmt", "stm32wb55cg", "wb55_thread"]

# embassy-stm32 0.6.0 with the patch in patches/, which makes Stop mode work on
# the STM32WB (see "Boards on battery" in AGENTS.md). `just embassy-stm32`
# creates the directory, and every recipe that builds the firmware runs it.
[patch.crates-io]
embassy-stm32 = { path = "../.cache/embassy-stm32" }

[profile.release]
debug = 2
lto = "fat"
# Not "s": with the microphone, that no longer fits the firmware's 224 K.
opt-level = "z"
codegen-units = 1

[profile.dev]
opt-level = 1
