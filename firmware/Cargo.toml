[package]
name = "sensor-board-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Pinned to the embassy commit checked out in ~/code/embassy (2026-02-28).
embassy-stm32 = { version = "0.5.0", git = "https://github.com/embassy-rs/embassy.git", rev = "e7b2b4e2c4ab1cbe77531fef7d78c3437c659b6c", features = ["stm32wb55cg", "time-driver-any", "unstable-pac"] }
embassy-executor = { version = "0.9.1", git = "https://github.com/embassy-rs/embassy.git", rev = "e7b2b4e2c4ab1cbe77531fef7d78c3437c659b6c", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5.0", git = "https://github.com/embassy-rs/embassy.git", rev = "e7b2b4e2c4ab1cbe77531fef7d78c3437c659b6c", features = ["tick-hz-1_000_000"] }
embassy-usb = { version = "0.5.1", git = "https://github.com/embassy-rs/embassy.git", rev = "e7b2b4e2c4ab1cbe77531fef7d78c3437c659b6c", default-features = false }
embassy-futures = { version = "0.1.2", git = "https://github.com/embassy-rs/embassy.git", rev = "e7b2b4e2c4ab1cbe77531fef7d78c3437c659b6c" }
# Local copy of embassy-stm32-wpan (same embassy rev) with a Thread CLI
# subsystem and FUS helpers that upstream does not have yet.
embassy-stm32-wpan = { path = "vendor/embassy-stm32-wpan", features = ["stm32wb55cg", "wb55_thread"] }
embassy-sync = { version = "0.7.2", git = "https://github.com/embassy-rs/embassy.git", rev = "e7b2b4e2c4ab1cbe77531fef7d78c3437c659b6c" }

cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
# set-vtor: point VTOR at our own vector table on reset, so the app works no
# matter what the ROM bootloader left in VTOR after a DFU ":leave".
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
heapless = { version = "0.9", default-features = false }

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1

[profile.dev]
opt-level = 1
