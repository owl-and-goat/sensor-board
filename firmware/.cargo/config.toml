[target.thumbv7em-none-eabihf]
# `cargo run --release` flashes over SWD and stays attached until Ctrl-C.
# --no-catch-reset: the firmware resets itself on purpose (`dfu`, panics, a
# launch by the ROM bootloader). With probe-rs's default reset catch each of
# those ends the run and leaves the core halted at the reset vector.
runner = "probe-rs run --chip STM32WB55CG --no-catch-reset"

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "debug"
